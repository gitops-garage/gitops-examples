{{- if .Values.secret }}

apiVersion: v1
kind: Secret

metadata:
  name: {{ include "springboot-basic.fullname" . }}-secret
  labels:
    {{- include "springboot-basic.labels" . | nindent 4 }}

type: Opaque

stringData:
{{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}

{{- end }}