apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "springboot-basic.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{ include "springboot-basic.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP