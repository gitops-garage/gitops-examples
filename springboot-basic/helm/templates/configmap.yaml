{{- if .Values.config }}

apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "springboot-basic.fullname" . }}-config
  labels:
    {{- include "springboot-basic.labels" . | nindent 4 }}

data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}

{{- end }}