#This values are for testing
replicaCount: 1

image:
  repository: springboot-basic
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config: {}

secret: {}

env: []

ingress:
  enabled: true

  className: "nginx"

  annotations: {}

  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

  tls: []

podAnnotations: {}

podLabels: {}